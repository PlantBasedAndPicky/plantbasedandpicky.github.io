<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant-Based & Picky</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f9f4; 
            color: #333; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            background-color: #2e7d32; 
            color: white; 
            padding: 2rem; 
            text-align: center; 
        }
        .container { 
            max-width: 800px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
        }
        .review-card { 
            background: white; 
            padding: 1.5rem; 
            border-radius: 8px; 
            margin-bottom: 1.5rem; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        a { color: #2e7d32; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>Plant-Based & Picky</h1>
        <p>Because Veggies Deserve the Spotlight 🌿</p>
    </header>

    <div class="container">
        <h2>Latest Reviews</h2>
        
        <div class="review-card">
            <h3>[Restaurant Name] - [City]</h3>
            <p><strong>Rating:</strong> ⭐⭐⭐⭐⭐</p>
            <p>Write a little bit about your experience here! Was the vegan burger amazing? How was the service?</p>
            <a href="https://instagram.com/plantbasedandpicky">Read more on our Instagram</a>
        </div>
    </div>
</body>
</html>
