<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant-Based & Picky</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f9f4; 
            color: #333; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            background-color: #2e7d32; 
            color: white; 
            padding: 2rem; 
            text-align: center; 
        }
        .container { 
            max-width: 800px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
        }
        .review-card { 
            background: white; 
            padding: 1.5rem; 
            border-radius: 8px; 
            margin-bottom: 1.5rem; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #2e7d32;
        }
        .review-card h3 {
            margin-top: 0;
            margin-bottom: 0.2rem;
            font-size: 1.4rem;
        }
        .location {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: block;
        }
        .ratings-box {
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 1rem;
        }
        .ratings-box p { margin: 5px 0; }
        a { color: #2e7d32; text-decoration: none; font-weight: bold; }
        .menu-link { 
            display: inline-block; 
            margin-top: 10px; 
            padding: 8px 12px; 
            background-color: #e8f5e9; 
            border-radius: 4px; 
        }
    </style>
</head>
<body>
    <header>
        <h1>Plant-Based & Picky</h1>
        <p>Because Veggies Deserve the Spotlight 🌿</p>
    </header>

    <div class="container">
        <h2>Latest Reviews</h2>
        
        <div class="review-card">
            <h3>Church - Temple of Fun</h3>
            <span class="location">📍 Sheffield</span>
            
            <div class="ratings-box">
                <p><strong>Veg Options:</strong> 🟢 Green (Fully Vegan)</p>
                <p><strong>Food Rating:</strong> ⭐⭐⭐⭐⭐</p>
            </div>
            
            <p>[Review description goes here - we can add this whenever you are ready!]</p>
            
            <a href="https://templeof.fun/pages/menus" class="menu-link" target="_blank">View their menu ➔</a>
        </div>

    </div>
</body>
</html>
