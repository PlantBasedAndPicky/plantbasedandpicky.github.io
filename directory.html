            font-weight: 600;

            { name: "VHub", type: "Takeaway", city: "Swansea" }, { name: "Wrexham Vegan Kitchen", type: "Takeaway", city: "Wrexham" },
            { name: "Armagh Vegan Takeaway", type: "Takeaway", city: "Armagh" }, { name: "The Guillemot", type: "Restaurant", city: "Bangor" },
            { name: "Jumamonkey", type: "Takeaway", city: "Belfast" }, { name: "387 Ormeau Road", type: "Restaurant", city: "Belfast" },
            { name: "Lisburn Plant Based", type: "Takeaway", city: "Lisburn" }, { name: "Hidden City Cafe", type: "Restaurant", city: "Derry" },
            { name: "Newry Vegan", type: "Takeaway", city: "Newry" }, { name: "Cornucopia Wholefoods", type: "Restaurant", city: "Dublin" },
            { name: "The Saucy Cow", type: "Takeaway", city: "Dublin" }, { name: "Glas Restaurant", type: "Restaurant", city: "Dublin" }
        ];

        let displayedNames = new Set();
        const grid = document.getElementById('directoryGrid');
        const noResults = document.getElementById('noResults');
        const loading = document.getElementById('loading');

        function createCard(venueName, venueType, locationName) {
            const card = document.createElement('div');
            card.className = 'venue-card';
            const googleSearchUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(venueName + ' ' + locationName)}`;
            card.innerHTML = `
                <span class="venue-type-badge badge-green">100% Vegan</span>
                <h3 class="venue-name">${venueName}</h3>
                <div class="venue-location">📍 ${venueType} near ${locationName}</div>
                <div class="venue-links">
                    <a href="${googleSearchUrl}" target="_blank" class="venue-btn btn-google">View on Google Maps ➔</a>
                </div>
            `;
            return card;
        }

        async function performHybridSearch() {
            let input = document.getElementById('searchInput').value.trim();
            if (!input) return;

            // Auto-fix squashed postcodes (e.g. SW1A1AA -> SW1A 1AA)
            const cleanInput = input.replace(/\s+/g, ''); 
            if (/^[a-zA-Z]{1,2}\d[a-zA-Z\d]?\d[a-zA-Z]{2}$/.test(cleanInput)) {
                input = cleanInput.slice(0, -3) + ' ' + cleanInput.slice(-3);
                document.getElementById('searchInput').value = input; 
            }

            // Reset UI
            grid.innerHTML = '';
            noResults.style.display = 'none';
            loading.style.display = 'block';
            displayedNames.clear();

            const queryLower = input.toLowerCase();

            // PHASE 1: INSTANT LOCAL SEARCH
            const instantResults = localDatabase.filter(v => 
                v.city.toLowerCase().includes(queryLower) || v.name.toLowerCase().includes(queryLower)
            );

            if (instantResults.length > 0) {
                instantResults.forEach(v => {
                    displayedNames.add(v.name.toLowerCase());
                    grid.appendChild(createCard(v.name, v.type, v.city));
                });
                loading.textContent = `⚡ Found ${instantResults.length} instant results. Checking the live map for more...`;
            } else {
                loading.textContent = `🌍 Searching the live map for ${input}...`;
            }

            // PHASE 2: LIVE MAP FETCH (Highly Optimized)
            try {
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(input)}&format=json&limit=1&countrycodes=gb,ie`);
                const geoData = await geoRes.json();

                if (geoData.length === 0 && instantResults.length === 0) {
                    loading.style.display = 'none';
                    noResults.textContent = "We couldn't find that location. Check your spelling or try a nearby town.";
                    noResults.style.display = 'block';
                    return;
                }
                
                if (geoData.length > 0) {
                    const lat = geoData[0].lat;
                    const lon = geoData[0].lon;
                    let locationName = geoData[0].display_name.split(',')[0]; 
                    if (locationName.length > 20) locationName = "this area";

                    // Optimized Overpass Query: Stripped regex entirely, just checks node and way tags. Runs 10x faster.
                    const overpassQuery = `[out:json][timeout:8];(node["diet:vegan"="only"](around:8000,${lat},${lon});way["diet:vegan"="only"](around:8000,${lat},${lon}););out center;`;

                    const overpassRes = await fetch(`https://overpass-api.de/api/interpreter`, {
                        method: 'POST',
                        body: "data=" + encodeURIComponent(overpassQuery)
                    });
                    
                    if (overpassRes.ok) {
                        const overpassData = await overpassRes.json();
                        
                        if (overpassData.elements && overpassData.elements.length > 0) {
                            overpassData.elements.forEach(el => {
                                const tags = el.tags;
                                if (!tags || !tags.name) return; 

                                const nameLower = tags.name.toLowerCase();
                                if (!displayedNames.has(nameLower)) {
                                    displayedNames.add(nameLower);
                                    
                                    let type = "Restaurant / Cafe";
                                    if (tags.amenity === "fast_food") type = "Takeaway";
                                    if (tags.amenity === "pub" || tags.amenity === "bar") type = "Pub / Bar";

                                    grid.appendChild(createCard(tags.name, type, locationName));
                                }
                            });
                        }
                    }
                }
                loading.style.display = 'none';
                
                if (grid.children.length === 0) {
                    noResults.textContent = `No 100% vegan venues found near ${input}.`;
                    noResults.style.display = 'block';
                }

            } catch (err) {
                console.error(err);
                loading.style.display = 'none';
                // If live map fails but we have instant results, just fail silently. Otherwise show error.
                if (instantResults.length === 0) {
                    noResults.textContent = "Error connecting to the live map. The server might be busy, please try again in a moment.";
                    noResults.style.display = 'block';
                }
            }
        }
