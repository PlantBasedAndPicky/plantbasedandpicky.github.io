        const grid = document.getElementById('directoryGrid');
        const searchInput = document.getElementById('searchInput');
        const regionFilter = document.getElementById('regionFilter');
        const typeFilter = document.getElementById('typeFilter');
        const noResults = document.getElementById('noResults');

        function renderVenues(data) {
            grid.innerHTML = '';
            if (data.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';

            data.forEach(v => {
                const card = document.createElement('div');
                card.className = `venue-card ${v.type.toLowerCase()}`;
                card.innerHTML = `
                    <span class="venue-type-badge">${v.type}</span>
                    <h3 class="venue-name">${v.name}</h3>
                    <div class="venue-location">📍 ${v.city}, ${v.region}</div>
                    <div class="ratings-row">
                        <div class="rating-badge" title="Google Rating">⭐ Google: ${v.google}</div>
                        <div class="rating-badge" title="TripAdvisor Rating">🟢 TripAdvisor: ${v.tripadvisor}</div>
                    </div>
                    <div class="venue-links">
                        <a href="https://www.google.com/maps/search/?api=1&query=${v.searchLink}" target="_blank" class="venue-btn btn-google">Google Maps</a>
                        <a href="https://www.tripadvisor.com/Search?q=${v.searchLink}" target="_blank" class="venue-btn btn-tripadvisor">TripAdvisor</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterVenues() {
            const query = searchInput.value.toLowerCase();
            const selectedRegion = regionFilter.value;
            const selectedType = typeFilter.value;

            const filtered = venues.filter(v => {
                const matchesQuery = v.name.toLowerCase().includes(query) || 
                                     v.city.toLowerCase().includes(query) || 
                                     v.region.toLowerCase().includes(query);
                const matchesRegion = selectedRegion === 'all' || v.region === selectedRegion;
                const matchesType = selectedType === 'all' || v.type === selectedType;
                return matchesQuery && matchesRegion && matchesType;
            });

            renderVenues(filtered);
        }

        searchInput.addEventListener('input', filterVenues);
        regionFilter.addEventListener('change', filterVenues);
        typeFilter.addEventListener('change', filterVenues);

        renderVenues(venues);
    </script>
